[package]
name = "video-replica-desktop"
version = "0.1.16"
description = "Internal video replica desktop app"
authors = ["Internal AI Team"]
edition = "2021"

[lib]
name = "video_replica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CW-020: the customer cloud edition is the sole default build target, so the
# default feature set is empty and a bare `cargo check` / `tauri build` compiles
# the customer app that can never silently boot a local business source of
# truth. The internal edition is an explicit opt-in: build it with
# `--features local-sidecar` (see the `check:tauri:internal` /
# `tauri:build:internal` scripts and the `tauri.internal.conf.json` overlay).
# CW-021 retires this feature and the local-sidecar source once the internal
# edition is fully withdrawn.
default = []
# DESK-02 (T29): opt-in gate for auto-starting the bundled local FastAPI
# sidecar; only the internal edition enables it.
local-sidecar = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# serde / serde_json / uuid are already resolved in the locked tree by the
# Tauri dependency graph itself (Cargo.lock pins uuid 1.24) 鈥?declaring them
# here adds no new external code to the audit surface, it only re-uses what
# is locked (搂10.2 dependency-review posture for the credential vault).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
