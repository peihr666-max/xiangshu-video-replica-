# CW-032 — the single default customer delivery package (唯一默认部署包).
#
# This file is the registered in-repo source of truth for the customer
# single-host topology; deploy/customer-git-rollout.sh points COMPOSE at it
# (override: CUSTOMER_COMPOSE=) instead of requiring an unregistered
# /opt/video-replica-candidate/compose.yaml host file.
#
# Roles (角色): db = data store; migrate = the ONLY schema-DDL role
# (one-shot, alembic upgrade head); api-1/api-2 = HTTP; worker-1..4 = tasks;
# backup = deploy/postgres/pitr-backup.sh on the host (rotation delegated to
# the archive platform's immutability policy — no local prune, by design).
#
# Connection-pool budget (全进程连接池预算): 2 API + 4 worker processes, each
# defaulting to VIDEO_REPLICA_PG_POOL_MAX=8 (ceiling 64, server/app/db_pg.py)
# => 6 x 8 = 48 + 1 transient migrate + 3 superuser_reserved = 52 <=
# max_connections=120 below. The machine-checked contract lives in
# server/tests/test_cw032_delivery_package.py.
#
# Required in deploy/customer/.env (gitignored): APP_IMAGE, POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB. Application configuration comes from
# /etc/video-replica/customer.env via env_file (template:
# deploy/customer.env.example); its VIDEO_REPLICA_DATABASE_URL must point at
# db:5432 on this compose network.

name: video-replica-customer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?deploy/customer/.env must define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/customer/.env must define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?deploy/customer/.env must define POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - superuser_reserved_connections=3
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: "no"
    env_file:
      - customer.env
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && python -m alembic upgrade head

  api-1:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    ports:
      - "127.0.0.1:8001:8000"
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api-2:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    ports:
      - "127.0.0.1:8002:8000"
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker-1:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m app.generation_worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-2:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m app.generation_worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-3:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m app.generation_worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-4:
    image: ${APP_IMAGE:?deploy/customer/.env must define APP_IMAGE}
    restart: unless-stopped
    env_file:
      - customer.env
    command:
      - sh
      - -lc
      - cd /opt/video-replica/server && exec python -m app.generation_worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
