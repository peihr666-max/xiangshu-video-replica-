name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Scan runtime contract surface
        run: npm run check:security

  server-full:
    name: Server full
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # 2026-08-26: raised 30 -> 60 — the full pytest suite (~1450 tests, PG
    # service + 10k queue load) measures 9-27 minutes depending on the hosted
    # runner's performance; a slow runner previously hit the 30-minute cap at
    # ~92% and the gate was cancelled mid-run (not a test failure).
    timeout-minutes: 60
    services:
      # M0 review H2: run the PostgreSQL tests in CI instead of silently
      # skipping them. Port/host/credentials mirror scripts/pg-fixture.sh so
      # TEST_POSTGRESQL_URL stays identical locally and in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: customer_v3_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d customer_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@localhost:5433/customer_v3_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python dependencies
        run: uv sync --project server --locked --group dev --python 3.12
      - name: Check Python formatting and lint
        run: |
          uv --cache-dir .uv-cache run --project server --locked ruff check server
          uv --cache-dir .uv-cache run --project server --locked ruff format --check server
      - name: Type-check server
        run: uv --cache-dir .uv-cache run --project server --locked python -m mypy --config-file server/pyproject.toml server/app
      - name: Run full server test suite
        run: uv --cache-dir .uv-cache run --project server --locked python -m pytest --rootdir server server/tests

  client:
    name: Client
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: customer_v3_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d customer_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://testuser:testpass@localhost:5433/customer_v3_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install browser-test server dependencies
        run: uv sync --project server --locked --group dev --python 3.12
      - name: Check web client and E2E sources
        run: |
          npm run check --workspace client
          npm run check:e2e
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run customer browser E2E
        run: npm run test:customer-e2e
      - name: Build web client
        run: npm run build
      - name: Audit JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(timeout 120s npm audit --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"

            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]] && { [[ "$status" -eq 124 ]] || grep -Eq '503 Service Unavailable|audit endpoint returned an error' <<<"$output"; }; then
              echo "npm audit service unavailable; retrying attempt $((attempt + 1))/3" >&2
              sleep $((attempt * 15))
              continue
            fi

            exit "$status"
          done

  rust:
    name: Rust
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('client/src-tauri/Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path client/src-tauri/Cargo.toml --check
      - name: Run Rust tests
        run: cargo test --manifest-path client/src-tauri/Cargo.toml --locked

  quality-linux:
    name: Linux quality gate
    needs: [server-full, client, rust]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux quality job to succeed
        shell: bash
        env:
          SERVER_RESULT: ${{ needs.server-full.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$SERVER_RESULT" = success
          test "$CLIENT_RESULT" = success
          test "$RUST_RESULT" = success

  windows-nsis:
    name: Windows Tauri and NSIS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore compiled FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/src-tauri/resources/ffmpeg/ffmpeg.exe
            client/src-tauri/resources/ffmpeg/ffprobe.exe
            client/src-tauri/resources/ffmpeg/ffmpeg-7.1.5.tar.xz
            client/src-tauri/resources/ffmpeg/BUILD-PACKAGES.txt
            client/src-tauri/resources/ffmpeg/SHA256SUMS.txt
          key: ffmpeg-windows-2025-${{ runner.arch }}-7.1.5-de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f-v1-${{ hashFiles('scripts/ffmpeg-minimal/build-windows-msys2.sh', 'scripts/ffmpeg-minimal/configure.sh') }}
      - name: Download and verify FFmpeg source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.5.tar.xz'
          Invoke-WebRequest 'https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz' -OutFile $source
          $actual = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if ($actual -ne 'DE668509CAF9E35E3CD162473441FDB29538C6D96ED080292B3CF9E6FC5D558F') {
            throw 'FFmpeg 7.1.5 source checksum mismatch'
          }
      - name: Set up MSYS2 build toolchain
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            nasm
            yasm
      - name: Build LGPL Windows ffmpeg tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          source_path="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-7.1.5.tar.xz"
          output_path="$PWD/client/src-tauri/resources/ffmpeg"
          bash scripts/ffmpeg-minimal/build-windows-msys2.sh "$source_path" "$output_path"
      - name: Verify Windows media tools
        shell: pwsh
        run: |
          $resourceRoot = 'client/src-tauri/resources/ffmpeg'
          $expectedHashes = @{}
          Get-Content -LiteralPath (Join-Path $resourceRoot 'SHA256SUMS.txt') | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})\s+\*?(.+)$') {
              throw "invalid SHA256SUMS line: $_"
            }
            $expectedHashes[$Matches[2]] = $Matches[1].ToUpperInvariant()
          }
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $path = Join-Path $resourceRoot $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "$name was not downloaded"
            }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHashes[$name]) {
              throw "$name does not match the uploaded SHA256 manifest"
            }
            $version = & $path -version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "$name is not runnable on Windows"
            }
            if ($version -match '--enable-gpl') {
              throw "$name unexpectedly enables GPL components"
            }
            if ($version -notmatch '--enable-version3') {
              throw "$name is missing the declared LGPL v3 build flag"
            }
            $version.Trim().Split([Environment]::NewLine)[0]
          }
          Get-Item -LiteralPath (Join-Path $resourceRoot 'ffmpeg.exe'), (Join-Path $resourceRoot 'ffprobe.exe') |
            Select-Object Name, Length
          $sourceName = 'ffmpeg-7.1.5.tar.xz'
          $sourcePath = Join-Path $resourceRoot $sourceName
          $sourceHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash
          if ($sourceHash -ne $expectedHashes[$sourceName] -or
              $sourceHash -ne 'DE668509CAF9E35E3CD162473441FDB29538C6D96ED080292B3CF9E6FC5D558F') {
            throw 'the bundled FFmpeg source archive does not match version 7.1.5'
          }

          $wavPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke.wav'
          $m4aPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke.m4a'
          $sampleRate = 8000
          $dataLength = $sampleRate * 2
          $writer = [System.IO.BinaryWriter]::new([System.IO.File]::Create($wavPath))
          try {
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
            $writer.Write([int](36 + $dataLength))
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes('WAVEfmt '))
            $writer.Write([int]16)
            $writer.Write([short]1)
            $writer.Write([short]1)
            $writer.Write([int]$sampleRate)
            $writer.Write([int]($sampleRate * 2))
            $writer.Write([short]2)
            $writer.Write([short]16)
            $writer.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
            $writer.Write([int]$dataLength)
            $writer.Write([byte[]]::new($dataLength))
          } finally {
            $writer.Dispose()
          }
          & (Join-Path $resourceRoot 'ffmpeg.exe') -hide_banner -loglevel error -y -i $wavPath -c:a aac $m4aPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $m4aPath)) {
            throw 'ffmpeg failed the WAV to AAC/M4A smoke conversion'
          }
          $durationText = & (Join-Path $resourceRoot 'ffprobe.exe') -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $m4aPath
          if ($LASTEXITCODE -ne 0) {
            throw 'ffprobe failed to read the smoke conversion duration'
          }
          $duration = [double]::Parse(
            $durationText.Trim(),
            [System.Globalization.CultureInfo]::InvariantCulture
          )
          if ($duration -lt 0.8 -or $duration -gt 1.2) {
            throw "unexpected smoke conversion duration: $duration"
          }

          $ffmpeg = Join-Path $resourceRoot 'ffmpeg.exe'
          function Assert-FullDecode {
            param(
              [string]$InputPath,
              [string]$StreamMap,
              [string]$FailureMessage
            )
            $decodeOutput = & $ffmpeg -v error -xerror -i $InputPath -map $StreamMap -f null - -progress pipe:1 -nostats 2>&1 | Out-String
            $decodeStatus = $LASTEXITCODE
            if ($decodeStatus -ne 0) {
              throw "$FailureMessage (exit $decodeStatus): $decodeOutput"
            }
            if ($decodeOutput -notmatch '(?m)^progress=end\s*$') {
              throw "$FailureMessage (missing progress=end): $decodeOutput"
            }
            $outTimeMatch = [regex]::Match($decodeOutput, '(?m)^out_time_us=([1-9][0-9]*)\s*$')
            $frameMatch = [regex]::Match($decodeOutput, '(?m)^frame=\s*([1-9][0-9]*)\s*$')
            if (-not $outTimeMatch.Success -and -not $frameMatch.Success) {
              throw "$FailureMessage (no decoded output): $decodeOutput"
            }
          }

          Assert-FullDecode -InputPath $m4aPath -StreamMap '0:a:0' -FailureMessage 'valid audio stream failed full decode'

          $mp3Path = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke.mp3'
          $mp3Base64 = Get-Content -LiteralPath 'scripts/ffmpeg-minimal/fixtures/ffmpeg-smoke.mp3.b64' -Raw
          [System.IO.File]::WriteAllBytes($mp3Path, [Convert]::FromBase64String($mp3Base64))
          Assert-FullDecode -InputPath $mp3Path -StreamMap '0:a:0' -FailureMessage 'valid MP3 audio stream failed full decode'

          $validVideoPath = Join-Path $env:RUNNER_TEMP 'h264-valid.mp4'
          $validVideoBase64 = Get-Content -LiteralPath 'scripts/ffmpeg-minimal/fixtures/h264-valid.mp4.b64' -Raw
          $validVideoBytes = [Convert]::FromBase64String($validVideoBase64)
          [System.IO.File]::WriteAllBytes($validVideoPath, $validVideoBytes)
          Assert-FullDecode -InputPath $validVideoPath -StreamMap '0:v:0' -FailureMessage 'valid H.264 video stream failed full decode'

          $truncatedVideoPath = Join-Path $env:RUNNER_TEMP 'h264-truncated.mp4'
          $truncatedVideoBytes = [byte[]]::new($validVideoBytes.Length - 64)
          [Array]::Copy($validVideoBytes, $truncatedVideoBytes, $truncatedVideoBytes.Length)
          [System.IO.File]::WriteAllBytes($truncatedVideoPath, $truncatedVideoBytes)
          $truncatedOutput = & $ffmpeg -v error -xerror -i $truncatedVideoPath -map '0:v:0' -f null - -progress pipe:1 -nostats 2>&1 | Out-String
          $truncatedStatus = $LASTEXITCODE
          if ($truncatedStatus -eq 0) {
            throw "truncated H.264 video unexpectedly passed full decode: $truncatedOutput"
          }
          # The non-zero status above is the expected result. Reset the step
          # exit code only after every positive and negative assertion passed.
          exit 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('client/src-tauri/Cargo.lock') }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check Tauri project
        run: npm run check:tauri
      - name: Check customer cloud target without local sidecar
        run: npm run check:tauri:customer
      - name: Clean Windows bundle outputs
        shell: pwsh
        run: Remove-Item -LiteralPath '.cargo-target/release/bundle/nsis' -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build unsigned internal NSIS installer
        run: npm run tauri:build -- --bundles nsis --no-sign --ci
      - name: Verify internal installer contains Windows media tools
        shell: pwsh
        run: |
          $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $sevenZip = if ($null -ne $sevenZipCommand) {
            $sevenZipCommand.Source
          } else {
            Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw '7-Zip is required to inspect the NSIS payload'
          }
          $installer = Get-ChildItem -LiteralPath '.cargo-target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'internal NSIS installer was not produced'
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'internal-nsis-payload'
          & $sevenZip x $installer.FullName "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw 'internal NSIS installer could not be inspected'
          }
          $expectedHashes = @{}
          Get-Content -LiteralPath 'client/src-tauri/resources/ffmpeg/SHA256SUMS.txt' | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+\*?(.+)$') {
              $expectedHashes[$Matches[2]] = $Matches[1].ToUpperInvariant()
            }
          }
          $required = @(
            'ffmpeg.exe',
            'ffprobe.exe',
            'ffmpeg-7.1.5.tar.xz',
            'BUILD-PACKAGES.txt',
            'SHA256SUMS.txt',
            'COPYING.LGPLv3',
            'SOURCE-NOTICE.md'
          )
          foreach ($name in $required) {
            $suffix = "/resources/ffmpeg/$name".ToLowerInvariant()
            $matches = @(Get-ChildItem -LiteralPath $extractRoot -Recurse -File | Where-Object {
              $_.FullName.Replace('\', '/').ToLowerInvariant().EndsWith($suffix)
            })
            if ($matches.Count -ne 1) {
              throw "internal NSIS installer must contain exactly resources/ffmpeg/$name"
            }
            if ($expectedHashes.ContainsKey($name)) {
              $payloadHash = (Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256).Hash
              if ($payloadHash -ne $expectedHashes[$name]) {
                throw "internal NSIS installer payload hash mismatch for $name"
              }
            }
          }
      - name: Record internal installer SHA256
        shell: pwsh
        run: Get-FileHash .cargo-target/release/bundle/nsis/*.exe -Algorithm SHA256
      - name: Clean Windows bundle outputs for customer build
        shell: pwsh
        run: Remove-Item -LiteralPath '.cargo-target/release/bundle/nsis' -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build unsigned customer cloud NSIS installer
        run: npm run tauri:build:customer
        env:
          # Contract-only unsigned artifact. Release builds replace this
          # non-routable origin with the approved staging/production origin.
          VITE_API_BASE_URL: https://staging.example.invalid
      - name: Verify customer installer excludes local launchers
        shell: pwsh
        run: |
          $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $sevenZip = if ($null -ne $sevenZipCommand) {
            $sevenZipCommand.Source
          } else {
            Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw '7-Zip is required to inspect the NSIS payload'
          }
          $installer = Get-ChildItem -LiteralPath '.cargo-target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'customer NSIS installer was not produced'
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'customer-nsis-payload'
          & $sevenZip x $installer.FullName "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw 'customer NSIS installer could not be inspected'
          }
          $forbiddenNames = @(
            'start-backend.bat',
            'start-backend.sh',
            'ffmpeg.exe',
            'ffprobe.exe',
            'ffmpeg-7.1.5.tar.xz',
            'BUILD-PACKAGES.txt',
            'SHA256SUMS.txt',
            'COPYING.LGPLv3',
            'SOURCE-NOTICE.md'
          )
          $forbidden = Get-ChildItem -LiteralPath $extractRoot -Recurse -File |
            Where-Object { $_.Name -in $forbiddenNames }
          if ($forbidden) {
            throw "customer installer contains local runtime resources: $($forbidden.FullName -join ', ')"
          }
      - name: Record customer cloud installer SHA256
        shell: pwsh
        run: Get-FileHash .cargo-target/release/bundle/nsis/*.exe -Algorithm SHA256
